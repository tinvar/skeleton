# The app's image, run as it is meant to run. From the app's root:
#
#   mkdir -m 0700 secrets
#   openssl rand -base64 32 >secrets/app_key
#   openssl rand -hex 24 >secrets/probe_token
#   openssl rand -hex 32 >secrets/trusted_proxy_secret
#   chmod 0600 secrets/*
#   cp .env.example .env     # then fill in APP_URL, APP_MAIL_FROM and APP_MAIL_PROVIDER
#   docker compose up -d --build
#
# The secrets are files, never in .env or the environment compose is run in,
# so `docker inspect` shows none: compose mounts each at /run/secrets/<name>,
# and the entrypoint -- root, before it starts anything -- reads each file a
# _FILE variable names there, as root or as the file's owner, and hands PHP
# its value. The renderers' user is refused one it could read itself.
# secrets/ is in .gitignore and .dockerignore; keep it 0700 and its files
# 0600, yours. The image refuses to start without an app key and a probe
# token, and holds neither.
#
# A provider's key goes the same way: a file in secrets/, a line for it under
# `secrets:` at the bottom and in the service's, and its _FILE variable --
# TINVAR_POSTMARK_TOKEN_FILE: /run/secrets/postmark_token -- beside the others.
#
# A TLS terminator goes in front (the cookies are __Host-), and must prove
# itself with APP_TRUSTED_PROXY_SECRET in X-Tinvar-Proxy, overwriting any a
# client sent (ADR 0134). On the host, with Caddy:
#
#   app.example.com {
#       reverse_proxy 127.0.0.1:8080 {
#           header_up X-Tinvar-Proxy {env.APP_TRUSTED_PROXY_SECRET}
#       }
#   }
#
# started with APP_TRUSTED_PROXY_SECRET="$(cat secrets/trusted_proxy_secret)".

services:
  app:
    build:
      context: .
    image: tinvar-app:dev
    environment:
      # The app key, 32 bytes or more, from secrets/app_key.
      TINVAR_APP_KEY_FILE: /run/secrets/app_key
      # The probes' only way in, the image's own healthcheck included: the
      # renderers share this container's loopback, so it is not trusted
      # without the token, and the entrypoint refuses to serve with none.
      # 32 characters or more, from secrets/probe_token.
      TINVAR_PROBE_TOKEN_FILE: /run/secrets/probe_token
      TINVAR_PROBE_TRUST_LOOPBACK: "0"
      # The accounts (ADR 0153): the https origin every emailed link is
      # built on and passkeys are made for, who the mail is from, and where
      # it goes -- each required, the boot stopping without it.
      APP_URL: ${APP_URL:?set APP_URL, the https origin the app is served on, as https://app.example}
      APP_MAIL_FROM: ${APP_MAIL_FROM:?set APP_MAIL_FROM, the address the app's email comes from}
      TINVAR_MAIL_PROVIDER: ${APP_MAIL_PROVIDER:?set APP_MAIL_PROVIDER, the provider that sends the app's mail (smtp, ses, postmark, mailgun, resend or sendgrid), and its own variables}
      # The provider's own settings, from .env where it names them -- empty
      # is unset -- and its key a secret like the others (the header shows how).
      TINVAR_SMTP_HOST: ${TINVAR_SMTP_HOST:-}
      TINVAR_SMTP_PORT: ${TINVAR_SMTP_PORT:-}
      TINVAR_SMTP_USERNAME: ${TINVAR_SMTP_USERNAME:-}
      TINVAR_SMTP_ENCRYPTION: ${TINVAR_SMTP_ENCRYPTION:-}
      TINVAR_SES_REGION: ${TINVAR_SES_REGION:-}
      TINVAR_MAILGUN_DOMAIN: ${TINVAR_MAILGUN_DOMAIN:-}
      TINVAR_MAILGUN_REGION: ${TINVAR_MAILGUN_REGION:-}
      # Who may open the admin panel; empty, nobody may.
      APP_ADMINS: ${APP_ADMINS:-}
      # The proxies in front, whose X-Forwarded-For names the client the
      # throttles count (ADR 0134). Every visitor reaches this container
      # through the TLS terminator, by the network's gateway when it runs on
      # the host, or from this network when it is a service beside this one:
      # keyed on that peer, they were one caller to every throttle, and one
      # visitor's flood refused them all. The network below, pinned to say which;
      # change both together. Empty, and the peer is the client.
      TINVAR_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-10.213.91.0/24}
      # What the terminator must also send, in X-Tinvar-Proxy, to be taken
      # for one -- the subnet's gateway is also where a published port's
      # userland proxy connects from, for anything on the host. Required,
      # since the range above is wider than one address: the app refuses to
      # boot without it. 32 characters or more, from secrets/trusted_proxy_secret.
      TINVAR_TRUSTED_PROXY_SECRET_FILE: /run/secrets/trusted_proxy_secret
    # Mounted at /run/secrets/<name>, read by the entrypoint alone.
    secrets: [app_key, probe_token, trusted_proxy_secret]
    # Loopback only: put a TLS terminator in front, since the cookies are
    # __Host- and the browser sends them over https alone.
    ports:
      - "127.0.0.1:8080:8080"
    # Nothing in the image is written to but the database's volume and two
    # tmpfs mounts.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
      # The renderers' pool: their user's, shared with the socket group, and
      # gone with the container.
      - /run/tinvar-renderer:rw,nosuid,nodev,noexec,uid=10002,gid=10003,mode=0750
    volumes:
      - data:/var/lib/app/data
    # The entrypoint, root until both sides are started, needs only these:
    # to start each process as its user, and to empty each one's bounding
    # set. Then no process in the container is root or keeps a capability.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SETPCAP]
    security_opt:
      - no-new-privileges:true
    # FrankenPHP finishes its requests (up to 10 s), then the renderers drain
    # theirs (up to 75 s).
    stop_grace_period: 120s
    restart: unless-stopped

# Pinned, so TINVAR_TRUSTED_PROXIES above can name it: the gateway the host's
# terminator connects through, and any terminator run as a service beside it.
networks:
  default:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-10.213.91.0/24}

volumes:
  data:

# Files in secrets/, never committed and never sent to a build. Compose
# refuses to start without each.
secrets:
  app_key:
    file: ./secrets/app_key
  probe_token:
    file: ./secrets/probe_token
  trusted_proxy_secret:
    file: ./secrets/trusted_proxy_secret
